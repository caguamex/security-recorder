<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Opciones de barra inferior</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
* { box-sizing: border-box; margin: 0; }
body { width: 1600px; padding: 50px 50px 60px; background: #E9ECF2; font-family: Inter, system-ui, sans-serif; color: #111; }
h1 { font-size: 46px; font-weight: 800; text-align: center; }
.sub { text-align: center; color: #5a6070; font-size: 22px; margin: 10px 0 40px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px; }
.card { border-radius: 28px; background: #fff; box-shadow: 0 12px 30px rgba(30, 40, 80, .1); overflow: hidden; }
.screen { position: relative; height: 230px; background: #F2F2F7; overflow: hidden; }
.screen::before { content: ""; position: absolute; left: 22px; right: 22px; top: 22px; height: 70px; border-radius: 14px; border-left: 6px solid #8B5CF6; background: #EFE8FF; }
.screen::after { content: ""; position: absolute; left: 22px; right: 22px; top: 106px; height: 50px; border-radius: 14px; border-left: 6px solid #E0457B; background: #FCE4EC; }
.screen.dark { background: #0B0B0C; } .screen.dark::before { background: #2A2340; } .screen.dark::after { background: #3A1E2A; }
.meta { padding: 18px 26px 22px; }
.n { font-size: 22px; font-weight: 800; } .d { font-size: 16px; color: #6a7080; margin-top: 4px; }
.e { font: 26px/1 "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
.lab { font-size: 12px; font-weight: 700; color: #6B6F7A; margin-top: 5px; }
.it { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2; }
.plus { width: 26px; height: 26px; }

/* 1 cápsula oscura */
.b1 { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 26px; padding: 12px 22px; border-radius: 999px; background: #17171B; box-shadow: 0 14px 30px rgba(0, 0, 0, .35); z-index: 3; }
.b1 .it .e { font-size: 24px; } .b1 .on::after { content: ""; position: absolute; bottom: -8px; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
.b1 .p { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #17171B; }
/* 2 muesca */
.b2 { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; z-index: 3; }
.b2 svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 -6px 14px rgba(0, 0, 0, .08)); }
.b2 .row { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding-top: 6px; }
.b2 .p { position: absolute; left: 50%; top: -30px; margin-left: -32px; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, #FF7EB3, #E0457B 50%, #A855F7); box-shadow: 0 10px 22px rgba(224, 69, 123, .45); }
.b2 .on .lab { color: #E0457B; }
/* 3 cristal líquido */
.screen.glass { background: linear-gradient(135deg, #FFD3E6, #D9C8FF 50%, #C7E5FF); }
.b3 { position: absolute; left: 22px; right: 22px; bottom: 18px; height: 74px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; border-radius: 37px; background: rgba(255, 255, 255, .45); backdrop-filter: blur(18px); border: 1.5px solid rgba(255, 255, 255, .85); box-shadow: 0 12px 30px rgba(80, 60, 140, .2), inset 0 1px 0 rgba(255, 255, 255, .9); z-index: 3; }
.b3 .on::before { content: ""; position: absolute; width: 76px; height: 60px; border-radius: 30px; background: rgba(255, 255, 255, .7); box-shadow: inset 0 1px 0 #fff, 0 4px 10px rgba(80, 60, 140, .15); z-index: -1; }
.b3 .p { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; margin: auto; color: #fff; background: linear-gradient(140deg, #8B5CF6, #EC4899); box-shadow: 0 8px 18px rgba(139, 92, 246, .45); }
/* 4 pastilla activa */
.b4 { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; display: flex; align-items: center; justify-content: space-around; padding: 0 14px; background: #fff; box-shadow: 0 -4px 18px rgba(0, 0, 0, .06); z-index: 3; }
.b4 .pill { display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px; border-radius: 999px; background: #E5F0FF; color: #007AFF; font-weight: 800; font-size: 15px; }
.b4 .p { width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; color: #fff; background: #007AFF; box-shadow: 0 8px 18px rgba(0, 122, 255, .4); }
/* 5 burbujas */
.b5 { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 14px; z-index: 3; }
.b5 .it { width: 58px; height: 58px; border-radius: 50%; background: #fff; box-shadow: 0 8px 18px rgba(30, 40, 80, .15); }
.b5 .on { background: #FFF0F6; box-shadow: 0 0 0 3px #E0457B, 0 8px 18px rgba(224, 69, 123, .3); }
.b5 .it:has(.p) { background: none; box-shadow: none; }
.b5 .p { border-radius: 50%; box-shadow: 0 10px 22px rgba(0, 0, 0, .3); width: 66px; height: 66px; margin-top: -8px; color: #fff; background: #111; display: grid; place-items: center; }
/* 6 minimal con línea */
.b6 { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: #fff; border-top: 1px solid #E3E5EA; z-index: 3; }
.b6 .on::before { content: ""; position: absolute; top: -14px; width: 36px; height: 3px; border-radius: 2px; background: #111; }
.b6 .on .lab { color: #111; }
.b6 .p { width: 48px; height: 48px; margin: auto; border-radius: 16px; display: grid; place-items: center; color: #fff; background: #111; }
/* 7 degradado */
.b7 { position: absolute; left: 18px; right: 18px; bottom: 16px; height: 76px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; border-radius: 26px; background: linear-gradient(120deg, #FF7EB3, #E0457B 45%, #A855F7); box-shadow: 0 14px 30px rgba(168, 85, 247, .35); z-index: 3; }
.b7 .lab { color: rgba(255, 255, 255, .85); } .b7 .on .lab { color: #fff; } .b7 .on .e { transform: scale(1.15); }
.b7 .p { width: 58px; height: 58px; margin: -30px auto 0; border-radius: 50%; display: grid; place-items: center; color: #E0457B; background: #fff; box-shadow: 0 10px 22px rgba(0, 0, 0, .2); }
/* 8 negro y dorado */
.b8 { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: #141416; border-top: 1px solid #2C2A26; z-index: 3; }
.b8 .lab { color: #8E8A80; } .b8 .on .lab { color: #D4AF6A; }
.b8 .on::before { content: ""; position: absolute; top: -10px; width: 40px; height: 2px; background: #D4AF6A; box-shadow: 0 0 10px #D4AF6A; }
.b8 .p { width: 56px; height: 56px; margin: -26px auto 0; border-radius: 50%; display: grid; place-items: center; color: #1A1408; background: linear-gradient(160deg, #F2D9A0, #D4AF6A 55%, #A9873F); box-shadow: 0 0 0 4px #141416, 0 8px 22px rgba(212, 175, 106, .4); }
</style>
</head>
<body>
<h1>Opciones para la barra de abajo</h1>
<p class="sub">Mismos botones: Agenda, Clientas, +, Servicios y Ajustes</p>
<div class="grid" id="g"></div>
<script>
const P = '<svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const I = [['📅', 'Agenda'], ['💁🏻‍♀️', 'Clientas'], null, ['💅🏻', 'Servicios'], ['⚙️', 'Ajustes']];
const items = (lab = true) => I.map((x, i) => x ? `<div class="it ${i === 0 ? 'on' : ''}"><span class="e">${x[0]}</span>${lab ? `<span class="lab">${x[1]}</span>` : ''}</div>` : `<div class="it"><div class="p">${P}</div></div>`).join('');
const notch = `<svg class="bg" viewBox="0 0 700 86" preserveAspectRatio="none"><path d="M0 14 Q0 0 14 0 H270 C298 0 300 46 350 46 C400 46 402 0 430 0 H686 Q700 0 700 14 V86 H0 Z" fill="#fff"/></svg>`;
const O = [
  ['1 · Cápsula oscura', 'Flotante, negra y compacta; solo emojis', `<div class="b1">${items(false)}</div>`],
  ['2 · Con muesca', 'Hueco curvo donde se acomoda el +', `<div class="b2">${notch}<div class="row">${items()}</div></div>`],
  ['3 · Cristal líquido', 'Estilo iOS más reciente; burbuja en la activa', `<div class="b3">${items()}</div>`, 'glass'],
  ['4 · Pastilla activa', 'La pestaña activa muestra su nombre', `<div class="b4"><div class="pill"><span class="e" style="font-size:22px">📅</span>Agenda</div><span class="e">💁🏻‍♀️</span><div class="p">${P}</div><span class="e">💅🏻</span><span class="e">⚙️</span></div>`],
  ['5 · Burbujas', 'Cada botón es su propio círculo', `<div class="b5">${items(false)}</div>`],
  ['6 · Minimal', 'Blanca, plana, con línea arriba de la activa', `<div class="b6">${items()}</div>`],
  ['7 · Degradado belleza', 'Rosa a morado, con el + blanco', `<div class="b7">${items()}</div>`],
  ['8 · Negro y dorado', 'Elegante, con luz dorada en la activa', `<div class="b8">${items()}</div>`, 'dark'],
];
document.getElementById('g').innerHTML = O.map(([n, d, h, cls]) => `<div class="card"><div class="screen ${cls || ''}">${h}</div><div class="meta"><div class="n">${n}</div><div class="d">${d}</div></div></div>`).join('');
</script>
</body>
</html>
