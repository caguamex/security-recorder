<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Recuperar acceso · Agendappx</title>
  <link rel="stylesheet" href="/recuperar-acceso/recuperar.css">
  <script src="/recuperar-acceso/recuperar.js" defer></script>
</head>
<body>
  <main>
    <p class="marca">Agendappx</p>
    <h1>Vuelve a tu agenda</h1>
    <p>Si Safari no te deja abrir la página, este botón instala la corrección y abre Agendappx.</p>
    <p>Tu sesión, tus fotos y los cambios guardados en este dispositivo se conservan.</p>
    <button id="reparar" type="button">Reparar y abrir Agendappx</button>
    <p id="estado" role="status" aria-live="polite">Necesitas conexión a internet.</p>
    <noscript>Activa JavaScript en Safari para reparar la actualización.</noscript>
  </main>
</body>
</html>
