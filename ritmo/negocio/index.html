    <label class="t">Publicar en grupos de Facebook (uno por uno)</label><div class="card list">${GRUPOS.map((g, i) => `<div class="row"><span class="av" style="--c:#1877F2">${I('fb').replace('class="ic "', 'class="ic" style="width:18px;height:18px;stroke:#fff"')}</span><span class="l"><b>${esc(g)}</b><small>${S.promo.enviados.has(i) ? 'Publicado hoy' : 'Copia el texto y abre el grupo'}</small></span><button type="button" class="b3 ${S.promo.enviados.has(i) ? 'ok' : 'p'}" data-grupo="${i}">${S.promo.enviados.has(i) ? 'Listo' : 'Publicar'}</button></div>`).join('')}</div>
    <button type="button" class="soft" data-act="promo-wa" style="margin-top:12px">${I('wa')}Enviar por WhatsApp a clientas con permiso</button>
    <p class="foot">Facebook no permite publicar en grupos automáticamente: la app copia el texto y abre cada grupo para que solo pegues.</p>`);

  /* ---------- Clientas ---------- */
  const clientas = () => { const q = norm(S.q), l = CLIENTAS.filter(c => !q || norm(c[0] + c[1]).includes(q));
    return `<div class="top"><h1>Clientas</h1><button type="button" class="ibtn" data-act="contactos" aria-label="Contactos de WhatsApp">${I('users')}</button></div>
      <label class="sr" for="q">Buscar clienta</label><div class="search">${I('search')}<input id="q" type="search" placeholder="Buscar por nombre o teléfono" value="${esc(S.q)}" autocomplete="off"></div>
      <p class="foot">${CLIENTAS.length} clientas · ${CLIENTAS.filter(c => c[4]).length} aceptan promociones</p>
      <div class="card list">${l.map(([n, t, u, g, p]) => `<button type="button" class="row" data-cli="${esc(n)}"><span class="av" style="--c:#C2457E">${n.split(' ').map(x => x[0]).join('')}</span><span class="l"><b>${esc(n)}${p ? '<span class="tag">Promos</span>' : ''}</b><small>${t} · última visita ${u}</small></span><span class="r">${g ? money(g) : '—'}<small style="color:var(--ink3)">en total</small></span></button>`).join('')}</div>`; };
  const verCli = n => { const c = CLIENTAS.find(x => x[0] === n);
    sheet(`<div class="sh-nav"><button type="button" data-act="cerrar">Cerrar</button><b>Clienta</b><span style="width:52px"></span></div>
      <div style="display:flex;align-items:center;gap:14px"><span class="av" style="--c:#C2457E;width:62px;height:62px;font-size:20px">${n.split(' ').map(x => x[0]).join('')}</span><span><h1 style="font-size:24px">${esc(n)}</h1><small style="color:var(--ink3)">${c[1]} · ${c[4] ? 'Acepta promociones' : 'Sin promociones'}</small></span></div>
      <div class="kpis"><div class="kpi" style="--c:#1E9E4A"><b>${money(c[3])}</b><small>Gastado en total</small></div><div class="kpi" style="--c:#E0457B"><b>${c[3] ? Math.max(1, Math.round(c[3] / 600)) : 0}</b><small>Visitas</small></div></div>
      <div class="gh"><b>Historial</b></div><div class="card tl">${[['acr', '20 oct'], ['gel', '28 sep'], ['cej', '2 sep']].slice(0, c[3] ? 3 : 0).map(([s, d]) => `<div class="tli">${foto(sv(s).f)}<span class="l"><b>${sv(s).n}</b><small>${d}</small></span><b>${money(sv(s).p)}</b></div>`).join('') || '<p class="foot" style="padding:10px 0">Aún sin visitas.</p>'}</div>
      <div style="display:grid;gap:10px;margin-top:14px"><button type="button" class="big" data-act="nueva-cita">Agendar cita</button><button type="button" class="soft" data-act="wa-cita">${I('wa')}Escribirle por WhatsApp</button></div>`); };

  /* ---------- Mi negocio ---------- */
  const negocio = () => {
    if (S.sub) return { servicios, estadisticas, resenas, conexiones }[S.sub]();
    return `<div class="cover">${foto(939835)}${foto(5128220)}${foto(8468127)}</div>
      <div class="bizh"><span class="logo">AB</span><span class="l"><b>AB' Beauty Room</b> ${VER}<small><span style="color:var(--star)">★</span> 4.9 · 128 reseñas · 1.7 mil seguidores</small></span></div>
      <div class="mode"><button type="button" data-act="ver-cliente">${I('eye')}Ver como cliente</button><button type="button" data-act="cambiar">${I('swap')}Modo cliente</button></div>
      <div class="gh"><b>Tu negocio</b></div>
      <div class="tiles">
        <button type="button" class="tile ph" data-sub="servicios">${foto(16363470)}<span><b>Servicios y precios</b><small>${SERV.length} servicios con foto</small></span></button>
        <button type="button" class="tile ph" data-act="trabajos">${foto(17471377)}<span><b>Fotos de trabajos</b><small>24 publicadas</small></span></button>
        <button type="button" class="tile" data-sub="estadisticas" style="--c:#2F7BD6">${I('chart')}<span><b>Estadísticas</b><small>1,240 visitas esta semana</small></span></button>
        <button type="button" class="tile" data-sub="resenas" style="--c:#F5A623">${I('star')}<span><b>Reseñas</b><small>4.9 · 1 sin responder</small></span></button>
        <button type="button" class="tile" data-act="equipo" style="--c:#8B5CF6">${I('team')}<span><b>Equipo</b><small>3 especialistas · 1 recepción</small></span></button>
        <button type="button" class="tile" data-act="horario" style="--c:#14A3A0">${I('clock')}<span><b>Horarios</b><small>Lun a sáb · 10:00 a 20:00</small></span></button>
        <button type="button" class="tile" data-act="whatsapp" style="--c:#1E9E4A">${I('wa')}<span><b>WhatsApp</b><small>Vinculado · avisos automáticos</small></span></button>
        <button type="button" class="tile" data-sub="conexiones" style="--c:#E0457B">${I('link')}<span><b>Conexiones</b><small>Calendarios y Facebook</small></span></button></div>
      <div class="gh"><b>Apariencia</b></div>
      <div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 14px">${I('moon')}<span style="flex:1"><b>White / Dark</b><br><small style="color:var(--ink3)">También 5 temas de color</small></span><button type="button" class="b3" data-act="tema">Cambiar</button></div>`; };
  const back = () => `<button type="button" class="back" data-sub="">${I('back')}Mi negocio</button>`;
  const servicios = () => { const q = norm(S.svq).replace(/s\b/g, ''), l = SERV.filter(s => !q || norm(s.n + ' ' + s.cat).includes(q)), cats = [...new Set(l.map(s => s.cat))];
    return `${back()}<h1>Servicios y precios</h1>
      <label class="sr" for="svq">Buscar servicio</label><div class="search">${I('search')}<input id="svq" type="search" placeholder="Buscar: cejas, pestañas, uñas…" value="${esc(S.svq)}" autocomplete="off"></div>
      <div id="svres">${cats.map(c => `<div class="gh"><b>${c}</b><span>${l.filter(s => s.cat === c).length}</span></div>${l.filter(s => s.cat === c).map(s => `<div class="card svc">${foto(s.f, s.n)}<span class="l"><b>${esc(s.n)}</b><small>${s.min} min · ${Object.values(STAFF).filter((_, i) => (s.cat === 'Uñas' ? [0] : s.cat === 'Cabello' || s.cat === 'Maquillaje' ? [2] : [1]).includes(i)).map(x => x[0]).join(', ')}</small></span><span class="p">${money(s.p)}</span></div>`).join('')}`).join('') || '<p class="foot">Sin resultados.</p>'}</div>
      <button type="button" class="big" data-act="nuevo-servicio" style="margin-top:8px">Agregar servicio</button>`; };
  const estadisticas = () => { const v = [120, 180, 150, 210, 260, 320, 0], d = ['L', 'M', 'M', 'J', 'V', 'S', 'D'], mx = Math.max(...v);
    return `${back()}<h1>Estadísticas</h1><p class="foot" style="font-size:14px">Últimos 7 días</p>
      <div class="kpis"><div class="kpi" style="--c:#2F7BD6">${I('eye')}<b>1,240</b><small>Vieron tu perfil</small></div><div class="kpi" style="--c:#E0457B">${I('cal')}<b>18</b><small>Citas por la app</small></div>
        <div class="kpi" style="--c:#1E9E4A">${I('money')}<b>${money(11400)}</b><small>Ingresos por la app</small></div><div class="kpi" style="--c:#8B5CF6">${I('users')}<b>+46</b><small>Seguidores nuevos</small></div></div>
      <div class="gh"><b>Visitas al perfil</b></div><div class="card"><div class="bars">${v.map((x, i) => `<div class="${x ? '' : 'lo'}"><i style="height:${Math.max(6, x / mx * 86)}px"></i>${d[i]}</div>`).join('')}</div><p class="foot" style="padding:0 14px 12px">Domingo cerrado.</p></div>
      <div class="gh"><b>Fotos que más gustan</b></div><div class="tiles">${[[8468127, 'Balayage', '721'], [8554941, 'Extensiones', '530']].map(([f, n, k]) => `<div class="tile ph">${foto(f)}<span><b>${n}</b><small>♥ ${k} · 6 citas</small></span></div>`).join('')}</div>`; };
  const resenas = () => `${back()}<h1>Reseñas</h1><p class="foot" style="font-size:14px"><span style="color:var(--star)">★★★★★</span> 4.9 de 5 · 128 reseñas de citas verificadas</p>
    <div class="card" style="margin-top:12px">${RESENAS.map(([n, e, t, w, r], i) => `<div class="rev"><b>${n}</b> <span style="color:var(--star)">${'★'.repeat(e)}</span><p>${t}</p><small>✔︎ Cita verificada · ${w}</small>
      ${r ? `<div class="resp"><b>Tu respuesta:</b> ${esc(r)}</div>` : `<div style="margin-top:8px"><button type="button" class="b3 p" data-responder="${i}">Responder</button></div>`}</div>`).join('')}</div>`;
  const conexiones = () => `${back()}<h1>Conexiones</h1>
    <div class="gh"><b>Calendarios</b></div><div class="card">
      <div class="conn"><span class="q" style="--c:#4285F4">G</span><span class="l"><b>Google Calendar</b><small>Cada cita tiene su botón «Agregar»; o suscríbete al enlace privado</small></span><span class="pill">Activo</span></div>
      <div class="conn"><span class="q" style="--c:#111">31</span><span class="l"><b>Apple Calendar</b><small>Archivo .ics y enlace privado de suscripción</small></span><span class="pill">Activo</span></div></div>
    <div class="gh"><b>Redes</b></div><div class="card">
      <div class="conn"><span class="q" style="--c:#1877F2">f</span><span class="l"><b>Grupos de Facebook</b><small>${GRUPOS.length} grupos · publicar uno por uno</small></span><span class="pill">${GRUPOS.length}</span></div>
      <div class="conn"><span class="q" style="--c:#25D366">${I('wa').replace('class="ic "', 'class="ic" style="width:20px;height:20px"')}</span><span class="l"><b>WhatsApp</b><small>Vinculado con código de 8 dígitos · solo envía</small></span><span class="pill">Vinculado</span></div>
      <div class="conn"><span class="q" style="--c:#E0457B">A</span><span class="l"><b>Tu link para clientas</b><small>agendappx.app/ab-beauty-room</small></span><button type="button" class="b3" data-act="copiar">Copiar</button></div></div>`;

  /* ---------- Pintar ---------- */
  const TABS = [['hoy', 'hoy', 'Hoy'], ['agenda', 'cal', 'Agenda'], null, ['clientas', 'users', 'Clientas'], ['negocio', 'store', 'Mi negocio']];
  const render = () => {
    $('#tabbar').innerHTML = TABS.map(t => t ? `<button type="button" class="tab" data-tab="${t[0]}" aria-selected="${S.tab === t[0]}">${I(t[1])}${t[2]}${t[0] === 'hoy' && SOL.length ? `<span class="bd">${SOL.length}</span>` : ''}</button>` : `<button type="button" class="plus" data-act="mas" aria-label="Crear">${I('plus')}</button>`).join('');
    $('#screen').innerHTML = { hoy, agenda, clientas, negocio }[S.tab]();
  };
  const ir = o => { Object.assign(S, o); render(); scrollTo(0, 0); };

  document.addEventListener('input', e => {
    if (e.target.id === 'q') { S.q = e.target.value; const p = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(p, p); }
    if (e.target.id === 'svq') { S.svq = e.target.value; const p = e.target.selectionStart; render(); const q = $('#svq'); q.focus(); q.setSelectionRange(p, p); }
  });
  document.addEventListener('click', e => {
    if (e.target.id === 'sheet') { cerrar(); return; }
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.tab2) { cerrar(); ir({ tab: d.tab2, sub: d.sub || null }); return; }
    if (d.tab) { cerrar(); ir({ tab: d.tab, sub: null }); return; }
    if (d.sub !== undefined) { ir({ sub: d.sub || null }); return; }
    if (d.dia) { S.dia = +d.dia; render(); return; }
    if (d.st) { S.st = d.st; render(); return; }
    if (d.cita) { const [dd, h] = d.cita.split(':'); verCita(+dd, h + ':' + d.cita.split(':')[2]); return; }
    if (d.cli) { verCli(d.cli); return; }
    if (d.aceptar) { const o = SOL.find(x => x.id === +d.aceptar); SOL = SOL.filter(x => x !== o); render(); toast('Aceptada · le mandamos a ' + o.cl.split(' ')[0] + ' la confirmación y el anticipo por WhatsApp (simulado)'); return; }
    if (d.rechazar) { const o = SOL.find(x => x.id === +d.rechazar); SOL = SOL.filter(x => x !== o); render(); toast('Le propusimos otras horas a ' + o.cl.split(' ')[0] + ' por WhatsApp (simulado)'); return; }
    if (d.ncs) { S.nc.s = d.ncs; nuevaCita(); return; } if (d.ncst) { S.nc.st = d.ncst; nuevaCita(); return; } if (d.nch) { S.nc.h = d.nch; nuevaCita(); return; }
    if (d.pbf) { S.pub.f = +d.pbf; const t = $('#pbTxt').value; publicar(); $('#pbTxt').value = t; return; }
    if (d.pbs) { S.pub.s = d.pbs; const t = $('#pbTxt').value; publicar(); $('#pbTxt').value = t; return; }
    if (d.grupo) { S.promo.enviados.add(+d.grupo); promo(); toast('Texto copiado · se abriría el grupo ' + GRUPOS[+d.grupo]); return; }
    if (d.responder) { RESENAS[+d.responder][4] = '¡Gracias por tu reseña! Te esperamos pronto.'; render(); toast('Respuesta publicada'); return; }
    switch (d.act) {
      case 'cerrar': cerrar(); break;
      case 'mas': mas(); break;
      case 'nueva-cita': nuevaCita(); break;
      case 'publicar': publicar(); break;
      case 'promo': promo(); break;
      case 'nc-wa': S.nc.wa = !S.nc.wa; b.setAttribute('aria-checked', String(S.nc.wa)); break;
      case 'guardar-cita': { const cl = ($('#ncCl') || {}).value || 'Clienta', s = sv(S.nc.s); CITAS[1].push([S.nc.h, S.nc.s, cl, S.nc.st, 'w']); CITAS[1].sort((a, c) => a[0].localeCompare(c[0]));
        cerrar(); ir({ tab: 'agenda', dia: 1, st: 'todas' }); toast(`Cita guardada: ${s.n} a las ${S.nc.h}${S.nc.wa ? ' · WhatsApp enviado (simulado)' : ''}`); break; }
      case 'ok-publicar': cerrar(); toast('Publicado en tu perfil, en Social y en Explorar'); break;
      case 'promo-wa': cerrar(); toast('Promoción programada por WhatsApp: 40 hoy, el resto mañana'); break;
      case 'ir-sol': $('#sol').scrollIntoView({ behavior: 'smooth' }); break;
      case 'avisos': toast('Avisos: solicitudes nuevas, anticipos y citas que agenda tu equipo'); break;
      case 'ingresos': toast('Suma de las citas de hoy; el real se ve en Estadísticas'); break;
      case 'anticipos': toast('Daniela Torres · anticipo de $170 pendiente · vence hoy 15:00'); break;
      case 'calendarios': ir({ tab: 'negocio', sub: 'conexiones' }); break;
      case 'gcal': toast('Abriría Google Calendar con la cita lista para guardar'); break;
      case 'acal': toast('Descargaría el archivo .ics para Apple Calendar'); break;
      case 'wa-cita': toast('Abriría el chat de WhatsApp con el mensaje listo'); break;
      case 'mover': toast('Al moverla se le avisa por WhatsApp y queda en el historial'); break;
      case 'contactos': toast('Contactos de tu WhatsApp vinculado: elige cuáles pasan a Clientas'); break;
      case 'ver-cliente': toast('Abriría tu perfil público, como lo ven las clientas en Explorar y Social'); break;
      case 'cambiar': toast('Cambia al modo cliente para buscar y agendar en otros negocios'); break;
      case 'trabajos': toast('Tu cuadrícula de fotos, como en Social; con el + publicas más'); break;
      case 'equipo': toast('Equipo: invitaciones, roles y quién ve qué (ya diseñado)'); break;
      case 'horario': toast('Horario por persona, comida y días especiales (ya diseñado)'); break;
      case 'whatsapp': toast('Mensajes automáticos, anticipo y promociones (ya diseñado)'); break;
      case 'tema': { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; toast(r.dataset.theme === 'dark' ? 'Modo Dark' : 'Modo White'); break; }
      case 'nuevo-servicio': toast('Nombre, categoría, duración, precio y foto'); break;
      case 'copiar': { try { navigator.clipboard.writeText('https://agendappx.app/ab-beauty-room').then(() => toast('Link copiado'), () => toast('Selecciona el link para copiarlo')); } catch (err) { toast('Selecciona el link para copiarlo'); } break; }
    }
  });
  render();
})();
</script>
