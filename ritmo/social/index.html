    { id: 18, neg: 'bella', foto: 35031996, srv: 'Uñas acrílicas', txt: 'Almendradas con efecto mármol.', tags: ['unas', 'acrilicas'], likes: 289, com: 16, t: 'hace 1 semana' },
  ];
  const TIPO_FOTO = { 12464838: 'fade', 12706272: 'fade', 4625615: 'barba', 897262: 'barba', 10024234: 'barba', 7697441: 'barba', 939835: 'unas', 939836: 'unas', 17471377: 'unas', 16363470: 'unas', 7066258: 'unas', 35031996: 'unas',
    8554941: 'pestanas', 5128220: 'pestanas', 5177994: 'cejas', 8468127: 'color', 3356211: 'color', 3993312: 'color' };
  POSTS.forEach(p => { p.tipo = TIPO_FOTO[p.foto]; });
  const precio = p => (NEG[p.neg].serv.find(s => s.srv === p.srv || s[0] === p.srv) || [])[2];
  const minutos = p => (NEG[p.neg].serv.find(s => s[0] === p.srv) || [])[1];

  const S = { tab: 'inicio', q: '', cat: null, neg: null, ptab: 'trabajos', likes: new Set([2]), saves: new Set(), sigo: new Set(['ab', 'chuy']), citas: [], pub: { foto: 17471377, srv: null } };
  let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); };
  const sheet = h => { $('#sheetCard').innerHTML = h; $('#sheet').hidden = false; };
  const cerrar = () => { $('#sheet').hidden = true; };
  const k = n => n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + ' mil' : String(n);

  /* ---------- Piezas ---------- */
  const post = p => { const n = NEG[p.neg], lk = S.likes.has(p.id), sv = S.saves.has(p.id), pr = precio(p);
    return `<article class="post"><div class="ph pad" style="padding-left:16px;padding-right:16px"><button type="button" class="av" style="--av:${n.av}" data-neg="${p.neg}" aria-label="${esc(n.n)}">${n.ini}</button>
      <button type="button" class="who" data-neg="${p.neg}"><b>${esc(n.n)}</b> ${n.ver ? VER : ''}<small>${n.tipo} · ${n.km.toFixed(1)} km</small></button>
      <button type="button" class="follow ${S.sigo.has(p.neg) ? 'on' : ''}" data-seguir="${p.neg}">${S.sigo.has(p.neg) ? 'Siguiendo' : 'Seguir'}</button></div>
      <div class="media"><button type="button" data-ver="${p.id}" style="all:unset;display:block;width:100%;height:100%;cursor:pointer" aria-label="Ver publicación">${arte(p)}</button><span class="ilus">Foto: Pexels</span>
        <div class="book"><span class="l"><b>${esc(p.srv)}</b><small>${pr ? money(pr) : ''} · ${minutos(p) || 45} min · ${esc(n.n)}</small></span><button type="button" class="btnr" data-agendar="${p.id}">Agendar</button></div></div>
      <div class="acts"><button type="button" class="${lk ? 'liked' : ''}" data-like="${p.id}" aria-label="Me gusta">${I('heart')}${k(p.likes + (lk ? 1 : 0))}</button><button type="button" data-ver="${p.id}" aria-label="Comentarios">${I('chat')}${p.com}</button>
        <button type="button" data-act="compartir" aria-label="Compartir">${I('send')}</button><span class="sp"></span><button type="button" class="${sv ? 'saved' : ''}" data-save="${p.id}" aria-label="Guardar">${I('save')}</button></div>
      <p class="cap" style="margin:0"><b>${esc(n.u)}</b> ${esc(p.txt)}</p><p class="tags" style="margin:0">${p.tags.map(t => '#' + t).join(' ')}</p><p class="when" style="margin:0">${p.t}</p></article>`; };
  const celda = p => `<button type="button" data-ver="${p.id}" aria-label="${esc(p.srv)} en ${esc(NEG[p.neg].n)}">${arte(p)}<span class="pr">${precio(p) ? money(precio(p)) : ''}</span><span class="lk">${I('heart')}${k(p.likes)}</span></button>`;

  /* ---------- Pantallas ---------- */
  const inicio = () => { const hist = Object.entries(NEG);
    return `<div class="hdr pad"><span class="logo"><span class="mark">${I('cal')}</span><span>Agend<b>app</b>x</span></span><span><button type="button" class="hbtn" data-act="avisos" aria-label="Avisos">${I('bell')}<span class="dot"></span></button><button type="button" class="hbtn" data-tab="citas" aria-label="Mis citas">${I('cal')}</button></span></div>
      <div class="stories">${hist.map(([id, n], i) => `<button type="button" class="story" data-neg="${id}"><span class="ring ${i > 3 ? 'seen' : ''}"><span style="--av:${n.av}">${n.ini}</span></span><span class="n">${esc(n.u)}</span></button>`).join('')}</div>
      ${POSTS.slice(0, 6).map(post).join('')}`; };
  const buscar = () => { const cat = CATS.find(c => c[0] === S.cat), q = norm(S.q).replace(/s\b/g, '');
    const tipos = cat ? cat[4] : null;
    let lista = POSTS.filter(p => (!tipos || tipos.includes(p.tipo) || (cat && p.tags.includes(cat[0]))) && (!q || norm(p.srv + ' ' + p.txt + ' ' + p.tags.join(' ') + ' ' + NEG[p.neg].n + ' ' + NEG[p.neg].tipo).includes(q)));
    const negs = [...new Set(lista.map(p => p.neg))].map(id => [id, NEG[id]]).sort((a, b) => b[1].r - a[1].r || a[1].km - b[1].km);
    const titulo = cat ? cat[1] : S.q.trim();
    return `<div class="pad"><label class="sr" for="q">Buscar</label><div class="search">${I('search')}<input id="q" type="search" placeholder="Cortes, barberías, uñas, cejas…" value="${esc(S.q)}" autocomplete="off">${S.q || S.cat ? '<button type="button" class="x" data-act="limpiar" aria-label="Borrar">✕</button>' : ''}</div>
      <div class="chips">${CATS.map(([id, n, icn, col]) => `<button type="button" class="chip" style="--pi:${col}" data-cat="${id}" aria-pressed="${S.cat === id}">${I(icn)}${n}</button>`).join('')}</div>
      ${titulo ? `<div class="gh"><b>Locales que hacen ${esc(titulo.toLowerCase())}</b><span>${negs.length}</span></div>
        <div class="locs">${negs.map(([id, n]) => `<button type="button" class="loc" data-neg="${id}"><span class="av" style="--av:${n.av}">${n.ini}</span><span class="l"><b>${esc(n.n)}</b><small><span class="st">★</span> ${n.r} (${n.rev}) · ${n.km.toFixed(1)} km</small><small>${n.tipo}</small></span></button>`).join('') || '<p class="foot">Ningún local con eso todavía.</p>'}</div>
        <div class="gh"><b>Trabajos</b><span>${lista.length} fotos</span></div>` : '<div class="gh"><b>Descubre trabajos cerca de ti</b><span>Ordenado por popularidad</span></div>'}
      <div class="grid">${(titulo ? lista : POSTS.slice().sort((a, b) => b.likes - a.likes)).map(celda).join('') || ''}</div>
      ${titulo && !lista.length ? `<div class="empty">No encontramos trabajos de «${esc(titulo)}». Prueba con cortes, uñas o cejas.</div>` : ''}</div>`; };
  const negocio = () => { const id = S.neg, n = NEG[id], suyos = POSTS.filter(p => p.neg === id), sigo = S.sigo.has(id);
    const tipos = [...new Set(suyos.map(p => p.tipo))];
    return `<div class="hdr pad"><button type="button" class="hbtn" data-act="atras" aria-label="Regresar"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>${esc(n.u)}</b><button type="button" class="hbtn" data-act="compartir" aria-label="Compartir">${I('send')}</button></div>
      <div class="pad"><div class="prof"><span class="av" style="--av:${n.av}">${n.ini}</span><div class="nums"><span><b>${suyos.length}</b><small>trabajos</small></span><span><b>${k(n.seg + (sigo ? 1 : 0))}</b><small>seguidores</small></span><span><b>${n.r}</b><small>${n.rev} reseñas</small></span></div></div>
        <div class="bio"><b>${esc(n.n)}</b> ${n.ver ? VER : ''}<div class="k">${n.tipo}</div>
          <div class="r"><span><span class="st">★</span> ${n.r} · ${n.rev} reseñas verificadas</span><span>${n.km.toFixed(1)} km · abierto hasta las 20:00</span></div></div>
        <div class="pbtns"><button type="button" class="main" data-agendarneg="${id}">${I('cal')}Agendar</button><button type="button" data-seguir="${id}">${sigo ? 'Siguiendo' : 'Seguir'}</button><button type="button" data-act="wa" aria-label="WhatsApp">${I('wa')}</button></div>
        <div class="hls">${tipos.map(t => { const c = CATS.find(x => x[4].includes(t)); return `<button type="button" class="hl" data-cat2="${c[0]}"><span class="c" style="--pi:${c[3]}">${I(c[2])}</span>${c[1]}</button>`; }).join('')}<button type="button" class="hl" data-ptab="servicios"><span class="c" style="--pi:var(--rosa)">${I('list')}</span>Precios</button></div>
        <div class="ptabs" role="tablist"><button type="button" role="tab" data-ptab="trabajos" aria-selected="${S.ptab === 'trabajos'}" aria-label="Trabajos">${I('grid')}</button><button type="button" role="tab" data-ptab="servicios" aria-selected="${S.ptab === 'servicios'}" aria-label="Servicios y precios">${I('list')}</button><button type="button" role="tab" data-ptab="resenas" aria-selected="${S.ptab === 'resenas'}" aria-label="Reseñas">${I('star')}</button></div>
        ${S.ptab === 'trabajos' ? `<div class="grid">${suyos.map(celda).join('')}</div>` : S.ptab === 'servicios'
          ? `<div class="svl">${n.serv.map(([s, m, p]) => `<div><span class="l">${esc(s)}<small>${m} min</small></span><b class="p">${money(p)}</b><button type="button" data-agendarsrv="${esc(s)}">Agendar</button></div>`).join('')}</div>`
          : `<div class="svl">${[['Mariana R.', 'Me encantó, súper puntual y muy limpio.', 'hace 3 días'], ['Luis G.', 'El mejor fade que me han hecho.', 'hace 1 semana'], ['Sofía L.', 'Agendé desde la foto y fue igualito.', 'hace 2 semanas']].map(([w, t, c]) => `<div><span class="l"><b>${w}</b> <span style="color:var(--star)">★★★★★</span><small>${t}</small><small style="color:var(--ok)">✔︎ Cita verificada · ${c}</small></span></div>`).join('')}</div>`}</div>`; };
  const citas = () => `<div class="hdr pad"><b style="font-size:20px">Mis citas</b><span></span></div><div class="pad">${S.citas.length ? `<div class="svl">${S.citas.map(c => `<div><span class="av" style="--av:${NEG[c.neg].av}">${NEG[c.neg].ini}</span><span class="l"><b>${esc(c.srv)}</b><small>${esc(NEG[c.neg].n)} · ${c.dia} ${c.h}</small></span><small style="color:var(--rosa);font-weight:700">Por confirmar</small></div>`).join('')}</div><p class="foot">El negocio te confirma por WhatsApp.</p>` : '<div class="empty">Aún no tienes citas. Toca «Agendar» en cualquier foto.</div>'}</div>`;
  const perfil = () => `<div class="hdr pad"><b style="font-size:20px">Tu perfil</b><span></span></div><div class="pad"><div class="svl" style="padding:14px"><b>Entra con tu WhatsApp</b><p style="margin:6px 0 12px;color:var(--ink2);font-size:14px">Para seguir negocios, guardar fotos y ver tus citas en cualquier celular.</p><button type="button" class="big" data-act="entrar">Entrar con WhatsApp</button></div>
    <div class="gh"><b>Guardados</b><span>${S.saves.size}</span></div><div class="grid">${POSTS.filter(p => S.saves.has(p.id)).map(celda).join('')}</div>${S.saves.size ? '' : '<p class="foot">Toca el marcador de una foto para guardarla aquí.</p>'}</div>`;

  /* ---------- Hojas ---------- */
  const verPost = id => { const p = POSTS.find(x => x.id === id); sheet(`<div class="sh-nav"><button type="button" data-act="cerrar">Cerrar</button><b>Publicación</b><span style="width:52px"></span></div><div style="margin:0 -16px">${post(p)}</div>
    <div class="svl" style="margin-top:12px">${[['valeria.g', '¡Qué bonito! ¿Tienen lugar el sábado?'], [NEG[p.neg].u, 'Sí, agenda desde el botón de la foto 💗'.replace(' 💗', '')], ['luis_m', 'Quiero exactamente este.']].map(([u, t]) => `<div><span class="l"><b>${esc(u)}</b> ${esc(t)}</span></div>`).join('')}</div>`); };
  const agendar = (neg, srv) => { const n = NEG[neg], s = n.serv.find(x => x[0] === srv) || n.serv[0];
    sheet(`<div class="sh-nav"><button type="button" data-act="cerrar">Cancelar</button><b>Agendar</b><span style="width:60px"></span></div>
      <div class="svl"><div><span class="av" style="--av:${n.av}">${n.ini}</span><span class="l"><b>${esc(s[0])}</b><small>${esc(n.n)} · ${s[1]} min</small></span><b class="p">${money(s[2])}</b></div></div>
      <label class="t">Mañana, jueves 30</label><div class="slots">${['10:00', '11:30', '13:00', '15:30', '16:30', '18:00'].map((h, i) => `<button type="button" class="slot" data-hora="${h}" aria-pressed="${i === 1}">${h}</button>`).join('')}</div>
      <label class="t" for="tel">Tu WhatsApp</label><input class="in" id="tel" type="tel" inputmode="numeric" placeholder="55 1234 5678" autocomplete="tel-national">
      <div id="out" style="margin-top:14px"><button type="button" class="big" data-act="pedir" data-n="${neg}" data-s="${esc(s[0])}">Pedir cita · ${money(s[2])}</button><p class="foot">El negocio la confirma por WhatsApp. Sin crear cuenta.</p></div>`); };
  const publicar = () => { const n = NEG.ab, pb = S.pub; if (!pb.srv) pb.srv = n.serv[0][0];
    const OP = [939835, 17471377, 16363470, 939836, 35031996, 5128220, 8554941, 5177994];
    sheet(`<div class="sh-nav"><button type="button" data-act="cerrar">Cancelar</button><b>Nuevo trabajo</b><button type="button" data-act="publicar" style="font-weight:700">Publicar</button></div>
      <div class="prev">${arte({ foto: pb.foto, srv: pb.srv })}</div>
      <label class="t">Elige la foto (en la app: cámara o galería)</label><div class="picks">${OP.map(f => `<button type="button" data-pick="${f}" aria-pressed="${pb.foto === f}">${arte({ foto: f, srv: 'Foto' })}</button>`).join('')}</div>
      <label class="t">¿Qué servicio es?</label><div class="chips" style="flex-wrap:wrap;margin:0;padding:0">${n.serv.map(([s, m, p]) => `<button type="button" class="chip" data-psrv="${esc(s)}" aria-pressed="${pb.srv === s}">${esc(s)} · ${money(p)}</button>`).join('')}</div>
      <label class="t" for="ptxt">Descripción</label><textarea class="in" id="ptxt" placeholder="Cuéntales qué hiciste: colores, técnica, duración…">Acrílicas con brillo, listas para el fin de semana.</textarea>
      <p class="foot">Con el servicio ligado, la gente puede agendar exactamente esto desde la foto. Aparece en tu perfil, en el inicio de tus seguidores y en las búsquedas.</p>`); };

  /* ---------- Pintar ---------- */
  const TABS = [['inicio', 'home', 'Inicio'], ['buscar', 'search', 'Buscar'], null, ['citas', 'cal', 'Citas'], ['perfil', 'user', 'Perfil']];
  const render = () => {
    $('#tabbar').innerHTML = TABS.map(t => t ? `<button type="button" class="tab" data-tab="${t[0]}" aria-selected="${S.tab === t[0] && !S.neg}">${I(t[1])}${t[2]}</button>` : `<button type="button" class="plus" data-act="nuevo" aria-label="Publicar trabajo">${I('plus')}</button>`).join('');
    $('#screen').innerHTML = S.neg ? negocio() : { inicio, buscar, citas, perfil }[S.tab]();
  };
  const ir = o => { Object.assign(S, o); render(); scrollTo(0, 0); };

  document.addEventListener('input', e => { if (e.target.id !== 'q') return; S.q = e.target.value; S.cat = null; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); });
  document.addEventListener('click', e => {
    if (e.target.id === 'sheet') { cerrar(); return; }
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.tab) { cerrar(); ir({ tab: d.tab, neg: null }); return; }
    if (d.neg) { cerrar(); ir({ neg: d.neg, ptab: 'trabajos' }); return; }
    if (d.cat) { ir({ cat: S.cat === d.cat ? null : d.cat, q: '' }); return; }
    if (d.cat2) { ir({ tab: 'buscar', neg: null, cat: d.cat2, q: '' }); return; }
    if (d.ptab) { S.ptab = d.ptab; render(); return; }
    if (d.ver) { verPost(+d.ver); return; }
    if (d.like) { const id = +d.like; S.likes.has(id) ? S.likes.delete(id) : S.likes.add(id); const enHoja = !$('#sheet').hidden; render(); if (enHoja) verPost(id); return; }
    if (d.save) { const id = +d.save; S.saves.has(id) ? S.saves.delete(id) : S.saves.add(id); toast(S.saves.has(id) ? 'Guardado en tu perfil' : 'Quitado de guardados'); const enHoja = !$('#sheet').hidden; render(); if (enHoja) verPost(id); return; }
    if (d.seguir) { S.sigo.has(d.seguir) ? S.sigo.delete(d.seguir) : S.sigo.add(d.seguir); toast(S.sigo.has(d.seguir) ? 'Ahora sigues a ' + NEG[d.seguir].n : 'Dejaste de seguir a ' + NEG[d.seguir].n); render(); return; }
    if (d.agendar) { const p = POSTS.find(x => x.id === +d.agendar); agendar(p.neg, p.srv); return; }
    if (d.agendarneg) { agendar(d.agendarneg); return; }
    if (d.agendarsrv) { agendar(S.neg, d.agendarsrv); return; }
    if (d.hora) { b.parentElement.querySelectorAll('.slot').forEach(x => x.setAttribute('aria-pressed', String(x === b))); return; }
    if (d.pick) { S.pub.foto = +d.pick; const txt = $('#ptxt').value; publicar(); $('#ptxt').value = txt; return; }
    if (d.psrv) { S.pub.srv = d.psrv; const txt = $('#ptxt').value; publicar(); $('#ptxt').value = txt; return; }
    switch (d.act) {
      case 'cerrar': cerrar(); break;
      case 'atras': ir({ neg: null }); break;
      case 'limpiar': ir({ q: '', cat: null }); break;
      case 'nuevo': publicar(); break;
      case 'publicar': { const t = $('#ptxt').value.trim() || 'Nuevo trabajo.'; const pb = S.pub;
        POSTS.unshift({ id: Date.now(), neg: 'ab', foto: pb.foto, tipo: TIPO_FOTO[pb.foto], srv: pb.srv, txt: t, tags: [TIPO_FOTO[pb.foto], 'abbeautyroom'], likes: 0, com: 0, t: 'ahora' });
        cerrar(); ir({ tab: 'inicio', neg: null }); toast('Publicado en tu perfil y en el inicio de tus seguidores'); break; }
      case 'pedir': { const t = $('#tel').value.replace(/\D/g, ''); if (t.length !== 10) { toast('Escribe tu WhatsApp a 10 dígitos'); $('#tel').focus(); break; }
        const h = $('#sheetCard .slot[aria-pressed="true"]').dataset.hora; S.citas.unshift({ neg: d.n, srv: d.s, dia: 'jue 30', h });
        $('#out').innerHTML = `<div class="done"><b>Simulado: ${esc(NEG[d.n].n)} recibió tu solicitud.</b><br>${esc(d.s)} · jueves 30 a las ${h}. Te confirman por WhatsApp.</div><button type="button" class="big" data-tab="citas" style="margin-top:10px">Ver mis citas</button>`; break; }
      case 'compartir': toast('Comparte el enlace por WhatsApp, Instagram o Facebook'); break;
      case 'wa': toast('Abriría el WhatsApp del negocio'); break;
      case 'avisos': toast('Avisos: confirmaciones de citas y nuevos trabajos de quien sigues'); break;
      case 'entrar': toast('Lleva a «Escribe tu número de WhatsApp» y el código'); break;
    }
  });
  const diseno = v => { if (v === 'neutro') document.documentElement.dataset.diseno = 'neutro'; else delete document.documentElement.dataset.diseno;
    document.querySelectorAll('[data-dis]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dis === v))); };
  let dv = 'neutro'; try { dv = localStorage.getItem('social.diseno') || 'neutro'; } catch (e) {}
  diseno(dv);
  document.querySelector('.dis').addEventListener('click', e => { const b = e.target.closest('[data-dis]'); if (!b) return; diseno(b.dataset.dis); try { localStorage.setItem('social.diseno', b.dataset.dis); } catch (err) {} });
  const tema = v => { document.documentElement.dataset.theme = v; document.querySelectorAll('[data-tema]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tema === v))); };
  let tv = 'light'; try { tv = localStorage.getItem('social.tema') || 'light'; } catch (e) {}
  tema(tv);
  document.querySelector('.tem').addEventListener('click', e => { const b = e.target.closest('[data-tema]'); if (!b) return; tema(b.dataset.tema); try { localStorage.setItem('social.tema', b.dataset.tema); } catch (err) {} });
  render();
})();
</script>
