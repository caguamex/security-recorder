<!doctype html><html lang="es-MX"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro · Agendappx</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeef2;color:#111;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{max-width:1080px;margin:auto;padding:28px 24px 16px}h1{font-size:25px;letter-spacing:-.8px;margin:0 0 8px}p{font-size:14px;line-height:1.5;color:#626268}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}button{border:0;background:#fff;color:#111;padding:12px 18px;border-radius:24px;font:inherit;font-size:14px;cursor:pointer}button[aria-pressed=true]{background:#111;color:#fff}.pantallas{display:flex;justify-content:center;gap:24px;padding:12px 24px 32px;flex-wrap:wrap}figure{margin:0;max-width:390px;width:100%}figcaption{margin-bottom:12px;font-size:14px;font-weight:600}img{display:block;width:100%;border-radius:24px}small{display:block;max-width:1032px;margin:0 auto;padding:0 24px 28px;color:#626268;line-height:1.5}</style>
<header><h1>Agendappx · Registro</h1><p>Cuatro pasos, con los temas White y Dark de la app. Vista de revisión; todavía no publicada.</p><nav aria-label="Pasos del registro"></nav></header>

<small>Las capturas usan datos ficticios. La seguridad de Cloudflare se sustituye solo en la prueba local. No se enviaron mensajes ni se crearon cuentas reales.</small>
<script>const pasos=[['01-registro-cuenta','1 · Cuenta'],['02-registro-whatsapp','2 · WhatsApp'],['03-registro-codigo','3 · Código'],['04-registro-salon','4 · Salón']];function elegir(i){document.querySelectorAll('nav button').forEach((b,n)=>b.setAttribute('aria-pressed',String(i===n)));for(const [id,tema] of [['white','light'],['dark','dark']])document.getElementById(id).src=pasos[i][0]+'-'+tema+'.png';}pasos.forEach(([_,nombre],i)=>{const b=document.createElement('button');b.type='button';b.textContent=nombre;b.addEventListener('click',()=>elegir(i));document.querySelector('nav').append(b)});elegir(3);</script></html>
