<style>
/* Prototipo de cuentas y equipo con el diseño aprobado: barra minimal, + negro al centro, emojis y relieve.
   Una columna tipo iPhone (máx. 430 px) con una franja de demostración arriba para cambiar de rol. */
:root {
  --stage: #E9ECF2; --bg: #F2F2F7; --card: #FFFFFF; --card2: #FFFFFF; --ink: #0B0B0F; --ink2: #3C3C43; --ink3: #8A8A8E; --sep: #E3E5EA;
  --acc: #007AFF; --soft: #E5F0FF; --fill: rgba(118, 118, 128, .12); --segOn: #FFFFFF; --bar: #FFFFFF; --mas: #111111; --masInk: #FFFFFF;
  --ok: #1E9E4A; --warn: #B7791F; --bad: #E5383B; --demo: #1B1B20; --demoInk: #F5F5F7; --scrim: rgba(0, 0, 0, .32);
  --lift: 0 3px 0 rgba(30, 40, 80, .05), 0 12px 28px rgba(30, 40, 80, .10), inset 0 1px 0 #fff;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --emo: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --stage: #000000; --bg: #050506; --card: #141418; --card2: #202027; --ink: #F5F5F7; --ink2: #B9B9C2; --ink3: #7E7E89; --sep: #26262D;
  --acc: #0A84FF; --soft: #14243D; --fill: rgba(255, 255, 255, .1); --segOn: #3A3A40; --bar: #0B0B0E; --mas: #F5F5F7; --masInk: #000000;
  --ok: #34C759; --warn: #E8B54A; --bad: #FF6B5E; --demo: #1C1C22; --demoInk: #F5F5F7; --scrim: rgba(0, 0, 0, .6);
  --lift: 0 3px 0 rgba(0, 0, 0, .5), 0 12px 26px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .08); color-scheme: dark; } }
:root[data-theme="dark"] {
  --stage: #000000; --bg: #050506; --card: #141418; --card2: #202027; --ink: #F5F5F7; --ink2: #B9B9C2; --ink3: #7E7E89; --sep: #26262D;
  --acc: #0A84FF; --soft: #14243D; --fill: rgba(255, 255, 255, .1); --segOn: #3A3A40; --bar: #0B0B0E; --mas: #F5F5F7; --masInk: #000000;
  --ok: #34C759; --warn: #E8B54A; --bad: #FF6B5E; --demo: #1C1C22; --demoInk: #F5F5F7; --scrim: rgba(0, 0, 0, .6);
  --lift: 0 3px 0 rgba(0, 0, 0, .5), 0 12px 26px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .08); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font: 400 16px/1.35 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--acc); outline-offset: 2px; }
.e { font-family: var(--emo); font-style: normal; }

.phone { position: relative; max-width: 430px; min-height: 100vh; margin: 0 auto; background: var(--bg); }
.demo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--demo); color: var(--demoInk); font-size: 12px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--demo); }
.demo b { font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; opacity: .7; }
.demo button { padding: 4px 10px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; background: none; color: inherit; font-size: 12px; font-weight: 600; }
.demo button[aria-pressed="true"] { background: #F5F5F7; color: #0B0B0F; border-color: #F5F5F7; }
.demo .sp { flex: 1; }

.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.nav { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding-top: 6px; color: var(--acc); }
.nav button { border: 0; background: none; color: var(--acc); font-size: 17px; padding: 6px 0; display: flex; align-items: center; gap: 2px; }
h1 { margin: 2px 0 10px; font-size: 32px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.sub { margin: -6px 0 14px; color: var(--ink3); font-size: 15px; }
.gh { margin: 22px 4px 7px; color: var(--ink3); font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.foot { margin: 7px 4px 0; color: var(--ink3); font-size: 13px; }
.group { border-radius: 18px; background: var(--card); box-shadow: var(--lift); overflow: hidden; }
.cell { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 16px; border: 0; background: none; text-align: left; }
.cell + .cell { border-top: 1px solid var(--sep); }
.cell .l { flex: 1; min-width: 0; }
.cell .l small { display: block; color: var(--ink3); font-size: 13px; }
.cell .r { color: var(--ink3); font-size: 15px; }
.chev { color: var(--ink3); font-size: 20px; line-height: 1; }
.av { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--c, #8E8E93); color: #fff; font-size: 12.5px; font-weight: 800;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .15), inset 0 1px 0 rgba(255, 255, 255, .4); }
.av.s { width: 22px; height: 22px; font-size: 9.5px; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--ink2); font-size: 12px; font-weight: 700; }
.pill.admin { background: var(--ink); color: var(--bg); } .pill.recepcion { background: #E5F0FF; color: #0059C7; } .pill.especialista { background: #FCE4EC; color: #B4235A; }
.pill.pend { background: #FFF4D6; color: #8A5A00; }
.lock { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--fill); color: var(--ink2); font-size: 14px; }

.seg { display: flex; padding: 2px; border-radius: 10px; background: var(--fill); }
.seg button { flex: 1; min-height: 32px; border: 0; border-radius: 8px; background: none; font-size: 14px; font-weight: 600; }
.seg button[aria-selected="true"] { background: var(--segOn); box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 18px; border: 0; border-radius: 14px; font-size: 17px; font-weight: 700; }
.btn.fill { background: var(--acc); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--acc) 60%, #000), 0 12px 24px color-mix(in srgb, var(--acc) 35%, transparent), inset 0 1px 0 rgba(255, 255, 255, .45); }
.btn.dark { background: #000; color: #fff; box-shadow: 0 4px 0 #333, 0 10px 20px rgba(0, 0, 0, .2); }
.btn.line { background: var(--card); border: 1.5px solid var(--sep); box-shadow: 0 3px 0 var(--sep); }
.btn.soft { background: var(--fill); color: var(--acc); }
.btn.bad { background: none; color: var(--bad); }
.in { width: 100%; min-height: 50px; padding: 0 16px; border: 1.5px solid var(--sep); border-radius: 14px; background: var(--card); font-size: 17px; }

/* Entrar */
.auth { display: flex; flex-direction: column; gap: 12px; padding-block: 48px 40px; }
.logo { width: 84px; height: 84px; margin: 0 auto 6px; border-radius: 24px; display: grid; place-items: center; font-size: 44px;
  background: linear-gradient(160deg, var(--card2), var(--card)); box-shadow: 0 5px 0 var(--sep), 0 18px 34px rgba(30, 40, 80, .18), inset 0 1px 0 rgba(255, 255, 255, .5); }
.auth h1 { text-align: center; margin: 0; }
.auth .sub { text-align: center; margin: 0 0 18px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--ink3); font-size: 13px; margin: 6px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--sep); }
.fine { color: var(--ink3); font-size: 13px; text-align: center; margin: 6px 8px 0; }
.code { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 8px 0 4px; }
.code input { width: 100%; height: 58px; padding: 0; border: 1.5px solid var(--sep); border-radius: 14px; background: var(--card); text-align: center; font-size: 24px; font-weight: 800;
  box-shadow: 0 3px 0 var(--sep); font-variant-numeric: tabular-nums; }
.code input:focus { border-color: var(--acc); outline: none; box-shadow: 0 3px 0 color-mix(in srgb, var(--acc) 50%, transparent); }
.invite { padding: 18px; border-radius: 20px; background: var(--card); box-shadow: var(--lift); text-align: center; }
.invite .av { width: 58px; height: 58px; margin: 0 auto 10px; font-size: 20px; }

/* Agenda */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 4px 16px 8px; scrollbar-width: none; }
.chip { flex: none; display: flex; align-items: center; gap: 7px; padding: 5px 12px 5px 5px; border: 0; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 var(--sep), 0 4px 10px rgba(30, 40, 80, .06); font-size: 14px; font-weight: 600; }
.chip.all { padding-left: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.sum { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 2px 8px; }
.sum b { font-size: 17px; } .sum span { color: var(--ink3); font-size: 14px; }
.ev { display: flex; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-left: 5px solid var(--c); border-radius: 14px; text-align: left; margin-bottom: 10px;
  background: linear-gradient(170deg, color-mix(in srgb, var(--c) 6%, var(--card)), color-mix(in srgb, var(--c) 16%, var(--card)));
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 28%, transparent), 0 10px 22px color-mix(in srgb, var(--c) 18%, transparent); }
.ev .h { flex: none; width: 46px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.ev .h small { display: block; color: var(--ink3); font-weight: 500; font-size: 12px; }
.ev .b { flex: 1; min-width: 0; }
.ev .t { font-weight: 700; } .ev .m { color: var(--ink2); font-size: 14px; }
.ev .w { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--ink2); font-size: 13px; }
.ev .st { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ok); } .ev .st.p { color: var(--warn); }
.ev.busy { --c: #9A9AA3; opacity: .75; }
.cols { position: relative; display: grid; gap: 6px; margin: 0 -4px; overflow-x: auto; }
.col { position: relative; min-width: 0; }
.col .hd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 8px; font-size: 12.5px; font-weight: 700; }
.col .track { position: relative; height: calc(var(--hrs) * 56px); border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--sep); }
.col .blk { position: absolute; left: 4px; right: 4px; padding: 5px 7px; overflow: hidden; border: 0; border-left: 4px solid var(--c); border-radius: 9px; text-align: left; font-size: 12px; line-height: 1.2;
  background: color-mix(in srgb, var(--c) 18%, var(--card)); box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 30%, transparent); }
.col .blk b { display: block; font-size: 12.5px; }
.grid-h { position: absolute; left: 0; right: 0; height: 1px; background: var(--sep); }

/* Barra minimal */
.tabbar { position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 430px); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  padding: 10px max(6px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); background: var(--bar); border-top: 1px solid var(--sep); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; color: var(--ink3); font-size: 11px; font-weight: 600; }
.tab .e { font-size: 25px; line-height: 1; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 800; }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: -11px; width: 36px; height: 3px; border-radius: 2px; background: var(--ink); }
.fab { justify-self: center; width: 50px; height: 50px; display: grid; place-items: center; border: 0; border-radius: 16px; background: var(--mas); color: var(--masInk); box-shadow: 0 6px 14px rgba(0, 0, 0, .18); }

/* Hojas */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet-card { width: min(100%, 430px); max-height: 88vh; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

@keyframes up { from { transform: translateY(40px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet-card { animation: none; } }

.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { padding: 8px 13px; border: 1.5px solid var(--sep); border-radius: 12px; background: var(--card); font-size: 14px; font-weight: 600; }
.opt[aria-pressed="true"] { border-color: var(--acc); background: var(--soft); color: var(--acc); }
.opt:disabled { opacity: .4; cursor: not-allowed; }
.hist { margin: 0; padding: 0; list-style: none; }
.hist li { position: relative; padding: 0 0 14px 22px; font-size: 14px; color: var(--ink2); }
.hist li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
.hist li::after { content: ""; position: absolute; left: 7.5px; top: 16px; bottom: 0; width: 1px; background: var(--sep); }
.hist li:last-child::after { display: none; }
.hist b { color: var(--ink); }
.hist small { display: block; color: var(--ink3); font-size: 12.5px; }
.linkbox { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--card); box-shadow: var(--lift); font-size: 14px; font-weight: 600; word-break: break-all; }
.linkbox button { flex: none; border: 0; border-radius: 10px; padding: 7px 12px; background: var(--soft); color: var(--acc); font-weight: 700; font-size: 13px; }
.sw { position: relative; flex: none; width: 51px; height: 31px; border: 0; border-radius: 999px; background: var(--fill); transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--ok); } .sw[aria-checked="true"]::after { transform: translateX(20px); }

.confirm p { margin: 0 0 10px; font-size: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  padding: 11px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; box-shadow: 0 10px 24px rgba(0, 0, 0, .25); }
</style>

  const seguridad = () => S.rol !== 'admin' ? `<div class="nav"><button type="button" data-sub="">‹ Ajustes</button></div><h1>Seguridad</h1>
      <p class="gh">Tus sesiones</p><div class="group"><div class="cell"><span class="e" style="font-size:22px">📱</span><span class="l">${esc(yo().disp)}<small>Este dispositivo</small></span></div></div>
      <p class="foot">Entras con Apple, Google o un código por correo; no hay contraseña que se pueda robar.</p>`
    : `<div class="nav"><button type="button" data-sub="">‹ Ajustes</button></div><h1>Seguridad</h1>
      <div class="group">
        <div class="cell"><span class="e" style="font-size:22px">🔐</span><span class="l">Verificación en dos pasos<small>App autenticadora · obligatoria para Admin</small></span><span class="pill" style="background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)">Activa</span></div>
        <div class="cell"><span class="e" style="font-size:22px">🗄️</span><span class="l">Respaldo diario<small>Último: hoy 03:00 · se guardan 30 días</small></span></div>
        <div class="cell"><span class="e" style="font-size:22px">⏱️</span><span class="l">Cerrar sesión por inactividad<small>Especialistas y Recepción: después de 30 días sin abrir</small></span></div></div>
      <p class="gh">Sesiones abiertas del equipo</p><div class="group">${EQUIPO.filter(m => m.estado === 'activa').map(m => `<div class="cell">${av(m, 's')}<span class="l">${esc(m.n.split(' ')[0])}<small>${esc(m.disp)}</small></span>${m.id === 'antonio' ? '<span class="r">Tú</span>' : `<button type="button" class="opt" data-act="cerrar-sesion" data-q="${m.n.split(' ')[0]}" style="padding:5px 10px;font-size:13px">Cerrar</button>`}</div>`).join('')}</div>
      <p class="gh">Historial de cambios</p><div class="group" style="padding:14px 16px 2px"><ul class="hist">${HIST.map(([q, a, w]) => `<li><b>${q}</b> ${a}<small>${w}</small></li>`).join('')}</ul></div>`;
  const invitar = () => sheet(`<div class="nav"><button type="button" data-act="cerrar">Cancelar</button><b>Invitar</b><span style="width:60px"></span></div>
    <p class="gh">Nombre</p><input class="in" id="invNombre" value="Brenda Castillo" autocomplete="off">
    <p class="gh">Rol</p><div class="seg" role="tablist"><button type="button" role="tab" aria-selected="false" data-invrol>Recepción</button><button type="button" role="tab" aria-selected="true" data-invrol>Especialista</button></div>
    <p class="gh">Servicios que hace</p><div class="opts">${SERV.map(s => `<button type="button" class="opt" data-invserv aria-pressed="${['gel', 'ped'].includes(s.id)}">${esc(s.n)}</button>`).join('')}</div>
    <p class="gh">Horario</p><div class="opts">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d, i) => `<button type="button" class="opt" data-invserv aria-pressed="${i === 5}" style="width:42px;padding:8px 0">${d}</button>`).join('')}</div>
    <div id="invOut" style="margin-top:20px"><button type="button" class="btn fill" data-act="crear-invitacion">Crear invitación</button>
    <p class="foot">Crea un enlace de un solo uso que vence en 48 horas. Lo mandas tú por WhatsApp.</p></div>`);

  /* ---------- Pintar ---------- */
  const TABS = [['agenda', '📅', 'Agenda'], ['clientas', '💁🏻‍♀️', 'Clientas'], null, ['servicios', '💅🏻', 'Servicios'], ['ajustes', '⚙️', 'Ajustes']];
  const render = () => {
    document.querySelectorAll('[data-rol]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.rol === S.rol)));
    const app = S.pant === 'app';
    $('#tabbar').hidden = !app;
    if (app) $('#tabbar').innerHTML = TABS.map(t => t ? `<button type="button" class="tab" role="tab" data-tab="${t[0]}" aria-selected="${S.tab === t[0]}"><span class="e">${t[1]}</span>${t[2]}</button>` : `<button type="button" class="fab" data-act="nueva" aria-label="Nueva cita">${PLUS}</button>`).join('');
    let h;
    if (!app) h = { entrar, codigo, dospasos, unirse }[S.pant]();
    else if (S.tab === 'ajustes' && S.sub === 'equipo') h = equipo();
    else if (S.tab === 'ajustes' && S.sub && S.sub.startsWith('miembro:')) h = verMiembro(S.sub.slice(8));
    else if (S.tab === 'ajustes' && S.sub === 'seguridad') h = seguridad();
    else h = { agenda, clientas, servicios, ajustes }[S.tab]();
    $('#screen').innerHTML = h;
    const d0 = $('#d0'); if (d0) d0.focus();
  };
  const ir = (o) => { Object.assign(S, o); render(); scrollTo(0, 0); };
  const dentro = () => ir({ pant: 'app', tab: 'agenda', sub: null, filtro: 'todas', vista: 'lista' });

  document.addEventListener('input', e => {
    const m = /^d(\d)$/.exec(e.target.id || ''); if (!m) return;
    e.target.value = e.target.value.replace(/\D/g, '').slice(-1);
    if (e.target.value && +m[1] < 5) $('#d' + (+m[1] + 1)).focus();
    if ([0, 1, 2, 3, 4, 5].every(i => $('#d' + i).value)) setTimeout(() => S.pant === 'codigo' && S.rol === 'admin' ? ir({ pant: 'dospasos' }) : dentro(), 180);
  });
  document.addEventListener('keydown', e => { const m = /^d(\d)$/.exec(e.target.id || ''); if (m && e.key === 'Backspace' && !e.target.value && +m[1] > 0) $('#d' + (+m[1] - 1)).focus(); });

  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) { if (e.target.id === 'sheet') cerrar(); return; }
    const d = b.dataset;
    if (d.rol) { S.rol = d.rol; if (S.pant === 'app') { S.sub = null; S.filtro = 'todas'; render(); toast('Ahora ves la app como ' + ROL[d.rol] + ' (' + yo().n.split(' ')[0] + ')'); } else render(); return; }
    if (d.demo === 'salir') { cerrar(); ir({ pant: 'entrar' }); return; }
    if (d.demo === 'invitacion') { cerrar(); ir({ pant: 'unirse' }); return; }
    if (d.tab) { ir({ tab: d.tab, sub: null }); return; }
    if (d.sub !== undefined) { ir({ sub: d.sub || null }); return; }
    if (d.filtro) { S.filtro = d.filtro; render(); return; }
    if (d.vista) { S.vista = d.vista; render(); return; }
    if (d.cita) { verCita(+d.cita); return; }
    if (d.ns) { N.s = d.ns; nueva(); return; } if (d.nst) { N.st = d.nst; nueva(); return; }
    if (d.ncl) { N.cl = d.ncl; nueva(); return; } if (d.nh) { N.h = d.nh; nueva(); return; }
    if (d.setrol) { const m = miembro(S.sub.slice(8)); m.rol = d.setrol; if (m.rol === 'recepcion') m.serv = []; render(); toast(m.n.split(' ')[0] + ' ahora es ' + ROL[m.rol]); return; }
    if (d.togserv) { const m = miembro(S.sub.slice(8)); m.serv = m.serv.includes(d.togserv) ? m.serv.filter(x => x !== d.togserv) : [...m.serv, d.togserv]; render(); return; }
    if (d.togver !== undefined) { const m = miembro(S.sub.slice(8)); m.verTodas = !m.verTodas; render(); toast(m.verTodas ? m.n.split(' ')[0] + ' ya puede ver la agenda de todas' : m.n.split(' ')[0] + ' solo verá sus citas'); return; }
    if (d.invrol !== undefined || d.invserv !== undefined) { if (d.invrol !== undefined) b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b))); else b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); return; }
    switch (d.act) {
      case 'proveedor': S.correo = S.rol === 'admin' ? 'antonio@correo.com' : ''; if (S.rol === 'admin') ir({ pant: 'dospasos' }); else dentro(); break;
      case 'enviar-codigo': { const v = $('#correo').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast('Escribe un correo válido, por ejemplo tu@correo.com'); $('#correo').focus(); break; } S.correo = v; ir({ pant: 'codigo' }); break; }
      case 'atras-entrar': ir({ pant: 'entrar' }); break;
      case 'reenviar': toast('Simulado: te mandamos un código nuevo'); break;
      case 'aceptar': { const br = miembro('brenda'); br.estado = 'activa'; br.disp = 'iPhone 12 · Safari'; COMO.especialista = 'brenda'; S.rol = 'especialista'; dentro(); toast('Bienvenida a AB\' Beauty Room, Brenda'); break; }
      case 'cerrar': cerrar(); break;
      case 'nueva': N.h = null; N.st = S.rol === 'especialista' ? yo().id : null; if (S.rol === 'especialista' && !yo().serv.includes(N.s)) N.s = yo().serv[0]; nueva(); break;
      case 'guardar': { if (!N.h) { toast('Elige un horario'); break; } const q = yo(); CITAS.push({ id: Date.now(), h: N.h, s: N.s, cl: N.cl, st: N.st, ok: false, hist: [[q.n.split(' ')[0], ROL[q.rol], 'la creó', 'Hoy · ahora']] });
        HIST.unshift([q.n.split(' ')[0], 'agendó ' + serv(N.s).n + ' para ' + CLIENTAS[N.cl][0], 'Hoy · ahora']); cerrar(); ir({ tab: 'agenda', sub: null }); toast('Cita guardada para ' + miembro(N.st).n.split(' ')[0] + ' a las ' + N.h); break; }
      case 'recordar': toast('Simulado: recordatorio enviado desde el WhatsApp del salón'); break;
      case 'mover': toast('Al moverla queda en el historial quién y cuándo'); break;
      case 'invitar': invitar(); break;
      case 'crear-invitacion': $('#invOut').innerHTML = `<p class="gh" style="margin-top:0">Enlace de invitación</p><div class="linkbox"><span style="flex:1">ritmo-belleza.app/unirse/K7Q-29M</span><button type="button" data-act="copiar">Copiar</button></div>
        <p class="foot">Mándalo por WhatsApp a ${esc($('#invNombre').value)}. Al abrirlo entra con Apple, Google o su correo y queda en tu equipo. Prueba cómo lo ve con «Ver invitación» arriba.</p>`; break;
      case 'copiar': { const t = 'https://ritmo-belleza.app/unirse/K7Q-29M'; try { navigator.clipboard.writeText(t).then(() => toast('Enlace copiado'), () => toast('Selecciona el enlace para copiarlo')); } catch (err) { toast('Selecciona el enlace para copiarlo'); } break; }
      case 'quitar': { const m = miembro(S.sub.slice(8)); $('#quitarBox').innerHTML = `<div class="confirm"><p>${m.estado === 'pendiente' ? `¿Cancelar la invitación de ${esc(m.n)}? El enlace deja de funcionar.` : `¿Quitar a ${esc(m.n)}? Pierde el acceso al momento, también en su teléfono. Sus citas se quedan en la agenda.`}</p>
          <div class="row2"><button type="button" class="btn soft" data-act="no-quitar">No</button><button type="button" class="btn fill" data-act="si-quitar" style="background:var(--bad);box-shadow:none">${m.estado === 'pendiente' ? 'Cancelar' : 'Quitar'}</button></div></div>`; break; }
      case 'no-quitar': render(); break;
      case 'si-quitar': { const m = miembro(S.sub.slice(8)); EQUIPO.splice(EQUIPO.indexOf(m), 1); ir({ sub: 'equipo' }); toast(m.n.split(' ')[0] + ' ya no tiene acceso; se cerró su sesión'); break; }
      case 'cerrar-sesion': toast('Se cerró la sesión de ' + d.q + '; tendrá que volver a entrar'); b.disabled = true; break;
    }
  });
  render();
})();
</script>
