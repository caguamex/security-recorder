<!doctype html>
<html lang="es-MX" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="description" content="Recorre la propuesta Neutro iOS de Agendappx. Vista previa independiente con datos ilustrativos.">
  <meta name="robots" content="noindex,nofollow">
  <title>Agendappx · Neutro iOS</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <main id="main" tabindex="-1"></main>
    <nav class="dock" aria-label="Navegación principal" id="dock"></nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <button class="circle glass" id="sheet-close" aria-label="Cerrar">✕</button>
      <strong id="sheet-title"></strong>
      <button class="circle primary" id="sheet-save" aria-label="Guardar">✓</button>
    </header>
    <div id="sheet-content"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
